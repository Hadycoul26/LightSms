name: Build APK

# Compile a chaque push, ou manuellement depuis l'onglet Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Necessaire pour que l'etape "Release" puisse creer un tag et publier l'APK.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Composants SDK necessaires
        run: sdkmanager "platforms;android-35" "build-tools;35.0.1"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build de l'APK debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publication de l'APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: LightSms-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Sur un repo public, un asset de release se telecharge sans authentification,
      # contrairement a un artifact. C'est ce qui permet de recuperer l'APK par URL.
      - name: Publication de l'APK (release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}"             app/build/outputs/apk/debug/app-debug.apk             --title "Light SMS build ${{ github.run_number }}"             --notes "APK debug construit automatiquement depuis le commit ${{ github.sha }}."
